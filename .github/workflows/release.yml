name: Claude plugin

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: claude-plugin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: bun scripts/validate-plugin.ts .
      - run: npx --yes @anthropic-ai/claude-code@2.1.271 plugin validate . --strict
      - run: npx --yes @anthropic-ai/claude-code@2.1.271 plugin validate .claude-plugin/plugin.json --strict

  open-release-pr:
    needs: validate
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/release/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Open release PR if absent
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: bun scripts/open-release-pr.ts
